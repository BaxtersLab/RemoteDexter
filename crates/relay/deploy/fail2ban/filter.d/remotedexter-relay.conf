# fail2ban filter for relayd, the RemoteDexter relay.
#
# Bans ONLY on the two refusals a genuine host or phone cannot produce: every
# RemoteDexter peer speaks crates/relay_proto's framing, so an oversized length
# prefix or a body that is not a control frame is a scanner or garbage, never a
# user on a bad network.
#
#   frame too large   relay_proto FrameError::TooLarge  public_reason()
#   malformed frame   relay_proto FrameError::Malformed public_reason()
#                     (MissingField shares the words; also not producible by a peer)
#
# Everything else relayd says is deliberately NOT here. The list, and the reasons,
# are in docs/RUNNING_YOUR_OWN_RELAY.md. crates/relay/tests/fail2ban_contract.rs
# loads this file and fails if a trigger string drifts from the code or a
# must-not-ban line is added.
#
# Line shape (journald via the systemd backend):
#   relay-host relayd[1234]: [relayd] 203.0.113.7:4242: frame too large

[INCLUDES]
before = common.conf

[Definition]
_daemon = relayd
failregex = ^%(__prefix_line)s\[relayd\] <ADDR>:\d+: (?:frame too large|malformed frame)$
ignoreregex =
