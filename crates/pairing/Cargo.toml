[package]
name = "pairing"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The one pairing implementation: a signed, versioned, in-memory QR invite with a one-use token. No network, no filesystem, no process side effects."

[dependencies]
# ed25519-dalek 2.x from the start. 1.x carries RUSTSEC-2022-0093 and pins
# curve25519-dalek 3, whose `zeroize >=1, <1.4` ceiling is what blocked the snow
# upgrade for two blocks. See docs/DEPENDENCIES.md section 3.0.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
qrcode = "0.14"

[lib]
name = "pairing"
path = "src/lib.rs"
