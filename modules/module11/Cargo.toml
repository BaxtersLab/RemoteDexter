[package]
name = "module11"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
stream_chunk = { path = "../stream_chunk" }
futures = "0.3"
thiserror = "2"
ahash = "0.8"
tokio = { version = "1.0", features = ["sync", "time", "macros", "rt"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
] }

# Linux screen capture. ashpd is a pure-Rust xdg-desktop-portal client (no C
# deps of its own); the gstreamer crates need libgstreamer1.0-dev and
# libgstreamer-plugins-base1.0-dev present at build time.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"], optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

[features]
default = ["linux-capture"]

# Real desktop capture on Linux, via xdg-desktop-portal ScreenCast -> PipeWire.
# On by default: a Linux host serving synthetic frames is not a remote desktop.
# Build with --no-default-features on a box without the GStreamer development
# headers — capture then falls back to the synthetic gradient and
# `ScreenCapturer::is_real()` reports false, so nothing mistakes it for the real
# thing. No effect on other targets; the dependencies are target-gated.
linux-capture = [
    "dep:ashpd",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
    "tokio/net",
]
