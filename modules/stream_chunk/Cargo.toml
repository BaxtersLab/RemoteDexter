[package]
name = "stream_chunk"
version = "0.1.0"
edition = "2021"

# Deliberately ZERO dependencies. Both ends of the wire need this format: the
# host (via module11) to produce chunks, and the Android client to reassemble
# them. Depending on module11 for it would drag 85 crates — including a second
# crypto stack (ed25519/curve25519) and an image decoder — into the client .so
# for the sake of a 14-byte header. Keeping the format in its own crate is what
# lets there be exactly one parser without that cost.
license = "AGPL-3.0-only"

[dependencies]
